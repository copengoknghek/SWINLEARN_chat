# Full dev stack: mysql + qdrant + ollama + api + web
# One command:  npm run dev   (or scripts/start-stack.cmd on Windows)
# Do not start individual containers in Docker Desktop — use Start on the swinlearn
# project row, or npm run dev. No depends_on on api/web: Docker Desktop starts one
# dependency tier per click, so chained depends_on needs 3+ clicks. Startup waits
# live in server/docker-start.js instead.
name: swinlearn

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: swinlearn
      MYSQL_USER: swinlearn
      MYSQL_PASSWORD: password
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uswinlearn -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/11434'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ollama-model-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "until ollama list >/dev/null 2>&1; do echo 'Waiting for Ollama...'; sleep 2; done; ollama list | grep -q nomic-embed-text || ollama pull nomic-embed-text",
      ]
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    environment:
      SWINLEARN_API_LEGACY_WATCH: "true"
      API_PORT: 3001
      DATABASE_URL: ${DOCKER_API_DATABASE_URL:-mysql://swinlearn:password@mysql:3306/swinlearn}
      SESSION_SECRET: ${SESSION_SECRET:-docker-development-session-secret-change-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SWINLEARN_GROQ_MODEL: ${SWINLEARN_GROQ_MODEL:-llama-3.1-8b-instant}
      SWINLEARN_GROQ_VISION_MODEL: ${SWINLEARN_GROQ_VISION_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      SWINLEARN_GROQ_CONTEXT_CHARS: ${SWINLEARN_GROQ_CONTEXT_CHARS:-12000}
      SWINLEARN_MAX_FILE_MB: ${SWINLEARN_MAX_FILE_MB:-20}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      SWINLEARN_EMBED_PROVIDER: ${SWINLEARN_EMBED_PROVIDER:-ollama}
      SWINLEARN_EMBED_MODEL: ${SWINLEARN_EMBED_MODEL:-nomic-embed-text}
      SWINLEARN_EMBED_DIMS: ${SWINLEARN_EMBED_DIMS:-768}
      SWINLEARN_EMBED_BATCH_SIZE: ${SWINLEARN_EMBED_BATCH_SIZE:-32}
      SWINLEARN_GEMINI_EMBED_BATCH_SIZE: ${SWINLEARN_GEMINI_EMBED_BATCH_SIZE:-100}
      SWINLEARN_GEMINI_MAX_BATCH_SIZE: ${SWINLEARN_GEMINI_MAX_BATCH_SIZE:-100}
      SWINLEARN_EMBED_BATCH_DELAY_MS: ${SWINLEARN_EMBED_BATCH_DELAY_MS:-}
      SWINLEARN_RETRIEVAL_TOP_K: ${SWINLEARN_RETRIEVAL_TOP_K:-8}
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["node", "server/docker-start.js"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3001/api/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
      VITE_DOCKER_DEV: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
      VITE_HMR_HOST: localhost
      VITE_HMR_CLIENT_PORT: "5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["npm", "run", "dev:native:web", "--", "--host", "0.0.0.0"]

volumes:
  mysql-data:
  node_modules:
  ollama-data:
  qdrant-data:
