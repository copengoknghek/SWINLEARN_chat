name: swinlearn

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: swinlearn
      MYSQL_USER: swinlearn
      MYSQL_PASSWORD: password
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uswinlearn -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      API_PORT: 3001
      DATABASE_URL: mysql://swinlearn:password@mysql:3306/swinlearn
      SESSION_SECRET: ${SESSION_SECRET:-docker-development-session-secret-change-me}
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["node", "server/docker-start.js"]

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["npm", "run", "dev:web", "--", "--host", "0.0.0.0"]

volumes:
  mysql-data:
  node_modules:
