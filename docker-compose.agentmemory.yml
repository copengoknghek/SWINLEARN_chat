# Optional Cursor/Codex agent memory (separate from main app stack).
# Start: npm run agentmemory:up  or  scripts/start-agentmemory.cmd
name: swinlearn-agentmemory

services:
  agentmemory-iii-init:
    image: busybox:1.36
    user: "0:0"
    volumes:
      - agentmemory-iii-data:/data
    entrypoint: ["sh", "-c", "chown -R 65532:65532 /data && chmod 755 /data"]
    restart: "no"

  agentmemory-iii-engine:
    image: iiidev/iii:${AGENTMEMORY_III_VERSION:-0.11.2}
    user: "65532:65532"
    depends_on:
      - agentmemory-iii-init
    ports:
      - "127.0.0.1:49134:49134"
      - "127.0.0.1:3111:3111"
      - "127.0.0.1:3112:3112"
      - "127.0.0.1:9464:9464"
    volumes:
      - agentmemory-iii-data:/data
      - ./docker/agentmemory/iii-config.docker.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3111/ 2>/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agentmemory-iii-data:
